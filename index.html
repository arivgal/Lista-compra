function clone(v){return JSON.parse(JSON.stringify(v))}let db;try{db=JSON.parse(localStorage.getItem(KEY))||clone(seed);if(!Array.isArray(db.recipes)||!Array.isArray(db.templates)||!db.weeks)throw Error('bad')}catch(e){db=clone(seed)}

function iso(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}function monday(d){d=new Date(d);d.setDate(d.getDate()-(d.getDay()+6)%7);return d}function shift(s,n){const d=parse(s);d.setDate(d.getDate()+n);return iso(d)}function weekStart(){return db.ui.date}function dayDate(n){return shift(weekStart(),n)}

function templateFor(s){return [...db.templates].filter(t=>t.from<=s).sort((a,b)=>b.from.localeCompare(a.from))[0]||db.templates[0]}

function recipe(id){return db.recipes.find(r=>r.id===id)||null}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function img(r){if(!r)return '<div class="photo-fallback">🍽️</div>';const src=r.photo||PHOTO[r.cat];return src?`<img class="foodimg" src="${esc(src)}" alt="Imagen ilustrativa de ${esc(r.name)}" loading="lazy" onerror="this.outerHTML='<div class=&quot;photo-fallback&quot;>🍽️</div>'">`:'<div class="photo-fallback">🍽️</div>'}

function selector(){const y=document.querySelector('#year'),m=document.querySelector('#month'),w=document.querySelector('#week');y.innerHTML=[2026,2027].map(a=>`<option value="${a}">${a}</option>`).join('');m.innerHTML=MONTHS.map((a,j)=>`<option value="${j}">${a}</option>`).join('');const d=parse(weekStart());y.value=d.getFullYear();m.value=d.getMonth();fillWeeks();}
function fillWeeks(){const y=+document.querySelector('#year').value,m=+document.querySelector('#month').value,w=document.querySelector('#week');const first=new Date(y,m,1),last=new Date(y,m+1,0);let cur=monday(first),arr=[];while(cur<=last){arr.push(iso(cur));cur.setDate(cur.getDate()+7)}w.innerHTML=arr.map((s,j)=>`<option value="${s}">Semana ${j+1} · ${parse(s).getDate()} ${MONTHS[parse(s).getMonth()].slice(0,3)} – ${parse(shift(s,6)).getDate()} ${MONTHS[parse(shift(s,6)).getMonth()].slice(0,3)}</option>`).join('');if(arr.includes(weekStart()))w.value=weekStart();else w.value=arr[0]}

function editView(){const days=currentMenu(),w=weekState();return statusBar()+`<div class="panel"><div class="notice">Los cambios en esta semana se guardan como borrador. Pulsa <b>Confirmar y repetir desde esta semana</b> para que el nuevo menú se aplique a las semanas posteriores. Puedes hacer cambios puntuales sin alterar la repetición.</div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="confirmTemplate()">✓ Confirmar y repetir desde esta semana</button><button class="btn" onclick="restoreWeek()">Restaurar menú heredado</button><button class="btn" onclick="togglePurchased()">${w.purchased?'✓ Compra realizada':'Marcar compra realizada'}</button></div></div>${days.map((d,j)=>`<section class="panel"><h3>${dayName(j)} ${parse(dayDate(j)).getDate()}</h3><div class="split"><div><b>☀️ Desayuno</b><p>${esc(label(d.breakfast))}</p><div class="muted">Media mañana: ${esc(label(d.morning))}</div><button class="btn soft" onclick="openPicker(${j},'breakfast')">Elegir desayuno y media mañana</button></div><div><b>🍲 Almuerzo</b><p>${esc(label(d.lunch))}</p><div class="muted">Postre: ${esc(label(d.lunchDessert))}</div><button class="btn soft" onclick="openPicker(${j},'lunch')">Elegir almuerzo y postre</button><label style="display:block;margin-top:8px"><input type="checkbox" ${d.outLunch?'checked':''} onchange="updateDay(${j},'outLunch',this.checked)"> Comer fuera</label></div><div><b>🌙 Cena</b><p>${esc(label(d.dinner))}</p><div class="muted">Postre: ${esc(label(d.dinnerDessert))}</div><button class="btn soft" onclick="openPicker(${j},'dinner')">Elegir cena y postre</button><label style="display:block;margin-top:8px"><input type="checkbox" ${d.outDinner?'checked':''} onchange="updateDay(${j},'outDinner',this.checked)"> Cenar fuera</label></div><div><b>👥 Raciones preparadas</b><div class="inline" style="margin-top:8px"><label>Des. <input style="width:65px" type="number" min="1" max="30" value="${d.portionsBreakfast||db.settings.people}" onchange="updateDay(${j},'portionsBreakfast',+this.value)"></label><label>Alm. <input style="width:65px" type="number" min="1" max="30" value="${d.portionsLunch||db.settings.people}" onchange="updateDay(${j},'portionsLunch',+this.value)"></label><label>Cena <input style="width:65px" type="number" min="1" max="30" value="${d.portionsDinner||db.settings.people}" onchange="updateDay(${j},'portionsDinner',+this.value)"></label></div>${d.lunch===find('Chili suave de ternera con pimientos y alubias rojas / patatas en dados')?`<label><input type="checkbox" ${d.chiliPotato?'checked':''} onchange="updateDay(${j},'chiliPotato',this.checked)"> Chili con patatas en dados en vez de alubias</label>`:''}</div></div></section>`).join('')}`}
function ensureEditable(){if(locked()){if(!confirm('Esta semana está protegida porque ya se planificó y compró. ¿Quieres modificarla? El estado de compra realizada se conservará.'))return false;weekState().locked=false}const w=weekState();if(!w.menu)w.menu=clone(currentMenu());return true}
function updateDay(j,k,v){if(!ensureEditable()){render();return}weekState().menu[j][k]=v;save();render()}
function repeatedDishWarning(j,k,id){
 if(!id||!['breakfast','lunch','dinner'].includes(k))return true;
 const r=recipe(id);if(!r)return true;
 const occurrences=[];
 currentMenu().forEach((day,i)=>{
  if(i===j)return;
  for(const meal of ['breakfast','lunch','dinner']){
   if(day[meal]===id)occurrences.push(dayName(i)+' ('+({breakfast:'desayuno',lunch:'almuerzo',dinner:'cena'}[meal])+')');
  }
 });
 if(!occurrences.length)return true;
 return confirm('⚠️ PLATO REPETIDO EN ESTA SEMANA\n\n«'+r.name+'» ya está previsto para: '+occurrences.join(', ')+'.\n\n¿Quieres repetirlo también el '+dayName(j)+'?');
}
function openPicker(j,k){const d=currentMenu()[j],sub=k==='breakfast'?'morning':k==='lunch'?'lunchDessert':'dinnerDessert',cat=k==='breakfast'?'breakfast':k==='lunch'?'lunch':'dinner';let selectedMain=d[k],selectedSub=d[sub],query='';const body=()=>{const matches=db.recipes.filter(r=>r.cat===cat&&r.name.toLocaleLowerCase('es').includes(query.toLocaleLowerCase('es')));document.querySelector('#modalBody').innerHTML=`<div class="formrow"><label>Buscar ${esc(CATNAME[cat].toLowerCase())}</label><input id="searchRecipe" value="${esc(query)}" placeholder="Escribe el nombre de un plato"></div><div class="picker-grid"><div><h3>🍽️ Plato principal</h3><div id="mainChoices" style="max-height:380px;overflow:auto">${matches.map(r=>`<button class="pick-item ${selectedMain===r.id?'selected':''}" data-pick="${r.id}">${esc(r.name)}</button>`).join('')||'<p>No hay coincidencias.</p>'}</div></div><div><h3>${k==='breakfast'?'🍎 Media mañana':'🍎 Postre'}</h3><div style="max-height:380px;overflow:auto"><button class="pick-item ${!selectedSub?'selected':''}" data-sub="">Sin seleccionar</button>${db.recipes.filter(r=>r.cat==='dessert').map(r=>`<button class="pick-item ${selectedSub===r.id?'selected':''}" data-sub="${r.id}">${esc(r.name)}</button>`).join('')}</div></div></div>`;document.querySelector('#searchRecipe').oninput=e=>{query=e.target.value;body();const x=document.querySelector('#searchRecipe');x.focus();x.setSelectionRange(x.value.length,x.value.length)};document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{selectedMain=b.dataset.pick;body()});document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{selectedSub=b.dataset.sub||null;body()})};modal(`Elegir ${CATNAME[cat].toLowerCase()} · ${dayName(j)}`,'',`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="applyPick">Guardar selección</button>`);body();document.querySelector('#applyPick').onclick=()=>{const effectiveMain=j===6&&k==='lunch'?find('Arroz con pavo'):selectedMain;if(effectiveMain!==d[k]&&!repeatedDishWarning(j,k,effectiveMain))return;if(!ensureEditable())return;const x=weekState().menu[j];x[k]=selectedMain;x[sub]=selectedSub;if(j===6&&k==='lunch'&&selectedMain!==find('Arroz con pavo')){alert('El almuerzo del domingo se mantiene como arroz con pavo.');x[k]=find('Arroz con pavo')}save();closeModal();render()}}
function confirmTemplate(){if(!ensureEditable())return;const s=weekStart();if(!confirm('¿Confirmar este menú y repetirlo desde esta semana en las semanas siguientes? Los menús históricos guardados no cambiarán.'))return;const menu=clone(weekState().menu);db.templates=db.templates.filter(t=>t.from!==s);db.templates.push({from:s,menu,created:new Date().toISOString()});weekState().confirmed=true;weekState().menu=menu;save();render()}
function restoreWeek(){if(locked()){alert('La semana protegida debe desbloquearse antes de restaurarla.');return}if(!confirm('¿Descartar los cambios particulares de esta semana?'))return;delete weekState().menu;weekState().confirmed=false;save();render()}

function recipeView(){const cat=document.querySelector('#recipeFilter')?.value||'all',q=document.querySelector('#recipeSearch')?.value||'';const list=db.recipes.filter(r=>(cat==='all'||r.cat===cat)&&r.name.toLocaleLowerCase('es').includes(q.toLocaleLowerCase('es')));return `<div class="panel"><div class="inline" style="justify-content:space-between"><div><h2>Recetario</h2><p class="muted">${db.recipes.length} opciones · ingredientes y cantidades orientativas editables · fotografías ilustrativas o propias</p></div><button class="btn primary" onclick="editRecipe()">+ Nueva receta</button></div><div class="filters"><select id="recipeFilter" onchange="filterRecipes()"><option value="all">Todas las categorías</option>${CATS.map(c=>`<option value="${c}" ${cat===c?'selected':''}>${CATNAME[c]}</option>`).join('')}</select><input id="recipeSearch" placeholder="Buscar recetas" value="${esc(q)}" oninput="filterRecipes()"></div></div><div class="recipe-grid" id="recipeResults">${list.map(r=>recipeCard(r)).join('')}</div>`}
function recipeCard(r){return `<article class="recipe-card">${img(r)}<h3>${esc(r.name)}</h3><p class="muted">${CATNAME[r.cat]} · ${r.time||'?'} min</p><div class="actions"><button class="btn soft" onclick="openRecipe('${r.id}')">Ver receta</button><button class="btn" onclick="editRecipe('${r.id}')">Editar</button></div></article>`}

function editRecipe(id){const r=id?clone(recipe(id)):{id:'r'+Date.now(),name:'',cat:'lunch',ingredients:[],steps:'',time:25,photo:'',nutrition:null};if(!r)return;modal(id?'Editar receta':'Añadir receta',`<div class="formrow"><label>Nombre</label><input id="rname" value="${esc(r.name)}"></div><div class="split"><div class="formrow"><label>Categoría</label><select id="rcat">${CATS.map(c=>`<option value="${c}" ${r.cat===c?'selected':''}>${CATNAME[c]}</option>`).join('')}</select></div><div class="formrow"><label>Tiempo (minutos)</label><input id="rtime" type="number" min="1" value="${r.time||25}"></div></div><div class="formrow"><label>Ingredientes (uno por línea): nombre | cantidad por ración | unidad | sección Mercadona</label><textarea id="ring" rows="7" placeholder="Tomate | 100 | g | Frutas y verduras">${esc(r.ingredients.map(x=>[x.name,x.qty,x.unit,x.section].join(' | ')).join('\n'))}</textarea><p class="muted">Secciones válidas: ${SECTIONS.join(', ')}</p></div><div class="formrow"><label>Elaboración</label><textarea id="rsteps" rows="4">${esc(r.steps)}</textarea></div><div class="formrow"><label>URL de fotografía (opcional)</label><input id="rphoto" value="${esc(r.photo||'')}"><p class="muted">También puedes cargar una fotografía desde el dispositivo. Las fotos se guardan localmente y pueden ocupar espacio.</p><input type="file" id="rfile" accept="image/*"></div>`,`<button class="btn" onclick="closeModal()">Cancelar</button>${id?`<button class="btn warn" onclick="deleteRecipe('${id}')">Eliminar</button>`:''}<button class="btn primary" id="saveRecipe">Guardar receta</button>`);document.querySelector('#saveRecipe').onclick=async()=>{r.name=document.querySelector('#rname').value.trim();r.cat=document.querySelector('#rcat').value;r.time=+document.querySelector('#rtime').value||25;r.steps=document.querySelector('#rsteps').value.trim();r.photo=document.querySelector('#rphoto').value.trim();r.ingredients=document.querySelector('#ring').value.split('\n').filter(x=>x.trim()).map(line=>{const [name,qty,unit,section]=line.split('|').map(x=>x.trim());return{name,qty:Math.max(0,Number(qty)||0),unit:unit||'ud',section:SECTIONS.includes(section)?section:'Otros'}}).filter(x=>x.name);if(!r.name){alert('Escribe el nombre de la receta.');return}const file=document.querySelector('#rfile').files[0];if(file){if(file.size>3*1024*1024){alert('La foto debe pesar menos de 3 MB.');return}r.photo=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})}const pos=db.recipes.findIndex(x=>x.id===r.id);if(pos>=0)db.recipes[pos]=r;else db.recipes.push(r);save();closeModal();render()}}
function deleteRecipe(id){if(!confirm('¿Eliminar esta receta del catálogo? Si estaba seleccionada en algún menú, quedará sin nombre.'))return;db.recipes=db.recipes.filter(r=>r.id!==id);save();closeModal();render()}
function grocery(){const menu=currentMenu(),sum=new Map();function put(x,mult){const key=x.name.trim().toLocaleLowerCase('es')+'|'+x.unit.trim().toLocaleLowerCase('es');if(!sum.has(key))sum.set(key,{name:x.name,qty:0,unit:x.unit,section:x.section});sum.get(key).qty+=x.qty*mult}for(const d of menu){for(const [k,portion,out] of [['breakfast',d.portionsBreakfast||db.settings.people,false],['morning',db.settings.people,false],['lunch',d.portionsLunch||db.settings.people,d.outLunch],['lunchDessert',db.settings.people,d.outLunch],['dinner',d.portionsDinner||db.settings.people,d.outDinner],['dinnerDessert',db.settings.people,d.outDinner]]){if(out)continue;const r=recipe(d[k]||(k==='breakfast'?defaultBreakfast.id:null));if(!r)continue;for(const x of r.ingredients){if(r.name.startsWith('Chili suave')&&x.name==='Alubias rojas cocidas'&&d.chiliPotato){put({name:'Patata',qty:160,unit:'g',section:V},portion)}else put(x,portion)}}}return [...sum.values()].sort((a,b)=>SECTIONS.indexOf(a.section)-SECTIONS.indexOf(b.section)||a.name.localeCompare(b.name,'es'))}
function itemKey(x){return x.name.toLocaleLowerCase('es')+'|'+x.unit.toLocaleLowerCase('es')}
function shoppingView(){const w=weekState(),auto=grocery(),manual=w.manual||[],items=[...auto,...manual.map(x=>({...x,manual:true}))].filter(x=>!(w.retired||[]).includes(itemKey(x))),done=items.filter(x=>w.checked?.[itemKey(x)]).length,group=SECTIONS.map(section=>({section,items:items.filter(x=>x.section===section)})).filter(g=>g.items.length);return `<div class="panel"><div class="inline" style="justify-content:space-between"><div><h2>🛒 Lista de compra</h2><p class="muted">${done} de ${items.length} productos marcados · ${db.settings.people} personas por defecto</p></div><div class="actions"><button class="btn" onclick="addManual()">+ Añadir producto</button><button class="btn" onclick="showRetired()">Recuperar retirados</button><button class="btn" onclick="window.print()">Imprimir</button></div></div><div class="progress"><span style="width:${items.length?done/items.length*100:0}%"></span></div><p class="muted">${w.purchased?'Esta semana está registrada como compra realizada.':'Compra aún no marcada como realizada.'} Los productos marcados como comprados se guardan por semana, no se copian a otras.</p><div class="inline"><label><input type="checkbox" ${w.purchased?'checked':''} onchange="togglePurchased()"> Compra realizada</label></div></div>${group.map(g=>`<section class="shopping-section"><h3>${esc(g.section)} · ${g.items.length}</h3>${g.items.map(x=>{const key=itemKey(x);return `<div class="shopping-row ${w.checked?.[key]?'done':''}"><input aria-label="Comprado ${esc(x.name)}" type="checkbox" ${w.checked?.[key]?'checked':''} onchange="markBought('${encodeURIComponent(key)}',this.checked)"><span class="itemtext">${esc(x.name)} ${x.manual?'<span class="tag">Manual</span>':''}</span><span class="qty">${Number(x.qty.toFixed(2))} ${esc(x.unit)}</span><label title="Ya tengo en casa"><input type="checkbox" ${w.pantry?.[key]?'checked':''} onchange="markPantry('${encodeURIComponent(key)}',this.checked)"> <span class="muted">Despensa</span></label><button title="Retirar producto" onclick="retire('${encodeURIComponent(key)}')">✕</button></div>`}).join('')}</section>`).join('')||'<div class="panel empty">No hay productos todavía.</div>'}<div class="panel"><p class="muted">Las cantidades son orientativas y se calculan a partir de las recetas. Se suman cantidades con el mismo nombre y unidad. Revisa las raciones y los envases antes de comprar.</p></div>`}
function markBought(key,yes){const w=weekState();w.checked ||= {};w.checked[decodeURIComponent(key)]=yes;save();render()}
function markPantry(key,yes){const w=weekState();w.pantry ||= {};w.pantry[decodeURIComponent(key)]=yes;save();render()}
function retire(key){const w=weekState();w.retired ||= [];key=decodeURIComponent(key);if(!w.retired.includes(key))w.retired.push(key);save();render()}
function showRetired(){const w=weekState();modal('Productos retirados',`<p class="muted">Recupera los productos que retiraste de esta semana.</p>${(w.retired||[]).map(k=>`<div class="shopping-row"><span class="itemtext">${esc(k.split('|')[0])}</span><button class="btn soft" onclick="recover('${encodeURIComponent(k)}')">Recuperar</button></div>`).join('')||'<p>No hay productos retirados.</p>'}`,`<button class="btn" onclick="closeModal()">Cerrar</button>`)}
function recover(k){const w=weekState();w.retired=w.retired.filter(x=>x!==decodeURIComponent(k));save();closeModal();render()}
function addManual(){modal('Añadir producto a la compra',`<div class="formrow"><label>Producto</label><input id="mname"></div><div class="split"><div class="formrow"><label>Cantidad</label><input id="mqty" type="number" min="0" step="0.1" value="1"></div><div class="formrow"><label>Unidad</label><select id="munit"><option>ud</option><option>g</option><option>kg</option><option>ml</option><option>l</option><option>paquete</option></select></div></div><div class="formrow"><label>Sección</label><select id="msection">${SECTIONS.map(s=>`<option>${s}</option>`).join('')}</select></div>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveManual()">Añadir</button>`)}
function saveManual(){const name=document.querySelector('#mname').value.trim();if(!name){alert('Escribe un producto.');return}const w=weekState();w.manual ||= [];w.manual.push({name,qty:+document.querySelector('#mqty').value||1,unit:document.querySelector('#munit').value,section:document.querySelector('#msection').value});save();closeModal();render()}
function settingsView(){return `<div class="panel"><h2>⚙️ Datos y preferencias</h2><div class="formrow"><label>Personas por defecto</label><input id="people" type="number" min="1" max="20" value="${db.settings.people}" style="max-width:100px" onchange="db.settings.people=Math.max(1,+this.value||3);save();render()"></div><div class="actions"><button class="btn primary" onclick="exportData()">⬇ Exportar copia JSON</button><button class="btn" onclick="document.querySelector('#importFile').click()">⬆ Importar copia JSON</button><input type="file" id="importFile" accept="application/json,.json" hidden onchange="importData(this.files[0])"></div><p class="muted">El archivo JSON guarda menús, recetas, listas y fotografías personalizadas. Guárdalo fuera del navegador para evitar pérdidas de datos.</p></div><div class="panel"><h3>Reglas del planificador</h3><p>El menú se repite automáticamente hasta que confirmes uno nuevo. Los cambios puntuales de una semana no afectan a las siguientes. El domingo se reserva el almuerzo para <b>arroz con pavo</b>. Los postres y la media mañana se eligen entre frutas y yogures.</p><p class="notice">La semana del 23 al 29 de noviembre de 2026 se ha cargado con el menú confirmado y la compra marcada como realizada. Los desayunos y postres no definidos permanecen vacíos.</p><p class="muted">La aplicación funciona sin servidor y sin cuenta de usuario. Las fotos predeterminadas requieren internet; las fotos cargadas desde el dispositivo se guardan localmente. Los datos no se sincronizan entre teléfonos y ordenadores.</p></div><div class="panel"><h3>Restablecer</h3><button class="btn warn" onclick="resetData()">Restablecer aplicación</button><p class="muted">Elimina los datos locales y recupera el menú inicial. Exporta una copia antes.</p></div>`}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mi-compra-saludable-respaldo-'+iso(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importData(file){if(!file)return;try{const obj=JSON.parse(await file.text());if(!Array.isArray(obj.recipes)||!Array.isArray(obj.templates)||!obj.weeks||!obj.ui)throw Error('Formato no válido');if(!confirm('La importación sustituirá los datos actuales. ¿Has exportado una copia de seguridad?'))return;db=obj;save();render()}catch(e){alert('No se pudo importar el archivo: '+e.message)}}
function resetData(){if(!confirm('¿Eliminar TODOS los datos guardados en este navegador? Esta acción no se puede deshacer.'))return;db=clone(seed);save();render()}
function modal(title,body,footer){document.querySelector('#modalTitle').textContent=title;document.querySelector('#modalBody').innerHTML=body;document.querySelector('#modalFooter').innerHTML=footer;document.querySelector('#dialog').showModal()}function closeModal(){document.querySelector('#dialog').close()}
function render(){selector();document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===db.ui.tab));document.querySelector('#content').innerHTML=({week:weekView,day:dayView,edit:editView,recipes:recipeView,shop:shoppingView,settings:settingsView}[db.ui.tab]||weekView)()}

// Valores iniciales: café con leche y tostada integral con AOVE; fruta sin asignar hasta elegirla.
let defaultBreakfast=db.recipes.find(r=>r.name==='Café con leche y tostada integral con AOVE');
if(!defaultBreakfast){defaultBreakfast={id:'default-coffee-aove',name:'Café con leche y tostada integral con AOVE',cat:'breakfast',ingredients:[{name:'Café',qty:8,unit:'g',section:'Otros'},{name:'Leche',qty:200,unit:'ml',section:'Huevos y refrigerados'},{name:'Pan integral',qty:60,unit:'g',section:'Panadería'},{name:'Aceite de oliva virgen extra',qty:10,unit:'ml',section:'Aceites, salsas y especias'}],steps:'Preparar café con leche y tostar el pan integral. Añadir AOVE a la tostada.',time:7,photo:'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=800&q=80',nutrition:null};db.recipes.push(defaultBreakfast);save()}
const fruitPhoto='https://images.unsplash.com/photo-1490474418585-ba9bad8fd0ea?w=600&q=75';
function visualImage(id,fallback){const r=recipe(id);if(r)return img(r);return `<img class="foodimg" src="${fallback||fruitPhoto}" alt="Imagen ilustrativa" loading="lazy">`}
function actualMealId(d,k){return d[k]||(k==='breakfast'?defaultBreakfast.id:null)}
function visualMeal(d,j,k){const sub=k==='breakfast'?'morning':k==='lunch'?'lunchDessert':'dinnerDessert',title=k==='breakfast'?'☕ DESAYUNO':k==='lunch'?'☀️ ALMUERZO':'🌙 CENA',id=actualMealId(d,k),r=recipe(id),subr=recipe(d[sub]);return `<section class="visual-meal"><div class="visual-meal-head"><strong>${title}</strong><button onclick="openVisualPicker(${j},'${k}')">▦ Cambiar plato</button></div><div class="visual-meal-pics"><button class="visual-pic" onclick="openRecipe('${id||''}')" aria-label="Ver receta ${esc(r?.name||'Sin elegir')}">${visualImage(id)}<span class="pic-label">${esc(r?.name||'Elegir plato')}</span></button><button class="visual-pic" onclick="openVisualPicker(${j},'${k}',true)" aria-label="Elegir ${k==='breakfast'?'media mañana':'postre'}">${visualImage(d[sub],fruitPhoto)}<span class="pic-label">${esc(subr?.name||'Elegir fruta o yogur')}</span></button></div></section>`}
function dayView(){const j=db.ui.day??0,d=currentMenu()[j],date=parse(dayDate(j));return `<section class="visual-day" id="swipeArea"><div class="visual-heading"><h2>${dayName(j).toUpperCase()} ${date.getDate()}</h2><span>‹ Desliza para cambiar de día ›</span></div><div class="visual-meals">${['breakfast','lunch','dinner'].map(k=>visualMeal(d,j,k)).join('')}</div></section>`}
function weekView(){const days=currentMenu();return `<div class="panel" style="padding:10px;margin-bottom:8px"><strong>Semana del ${parse(dayDate(0)).getDate()} al ${parse(dayDate(6)).getDate()} de ${MONTHS[parse(dayDate(6)).getMonth()]}</strong><div class="muted">Pulsa cualquier día para abrirlo a pantalla completa.</div></div><div class="visual-week">${days.map((d,j)=>`<button class="visual-week-card ${iso(new Date())===dayDate(j)?'today':''}" onclick="db.ui.day=${j};setTab('day')"><h3>${dayName(j)} ${parse(dayDate(j)).getDate()}</h3><small>ALMUERZO</small>${visualImage(d.lunch)}<p>${esc(label(d.lunch))}</p><small>CENA</small>${visualImage(d.dinner)}<p>${esc(label(d.dinner))}</p></button>`).join('')}</div>`}
function openVisualPicker(j,k,onlyDessert=false){const sub=k==='breakfast'?'morning':k==='lunch'?'lunchDessert':'dinnerDessert',cat=onlyDessert?'dessert':k,selected=onlyDessert?currentMenu()[j][sub]:actualMealId(currentMenu()[j],k);const items=db.recipes.filter(r=>r.cat===cat);modal(onlyDessert?(k==='breakfast'?'Media mañana: fruta o yogur':'Postre: fruta o yogur'):'Elegir '+CATNAME[k].toLowerCase(),`<div class="formrow"><input id="visualSearch" placeholder="Buscar entre ${items.length} opciones" oninput="filterVisualGallery()"></div><div class="gallery" id="visualGallery">${items.map(r=>`<button data-rid="${r.id}" class="${selected===r.id?'selected':''}" onclick="chooseVisual('${r.id}',${j},'${k}',${onlyDessert})">${img(r)}<span>${esc(r.name)}</span></button>`).join('')}</div>`,`<button class="btn" onclick="closeModal()">Cerrar</button>`)}
function filterVisualGallery(){const q=document.querySelector('#visualSearch').value.toLocaleLowerCase('es');document.querySelectorAll('#visualGallery [data-rid]').forEach(b=>b.hidden=!recipe(b.dataset.rid)?.name.toLocaleLowerCase('es').includes(q))}
function chooseVisual(id,j,k,onlyDessert){const key=onlyDessert?(k==='breakfast'?'morning':k==='lunch'?'lunchDessert':'dinnerDessert'):k;if(!onlyDessert&&j===6&&k==='lunch'&&id!==find('Arroz con pavo')){alert('El almuerzo del domingo está reservado para arroz con pavo.');return}if(!onlyDessert&&!repeatedDishWarning(j,k,id))return;if(!ensureEditable())return;weekState().menu[j][key]=id;save();closeModal();render()}
function openRecipe(id){const r=recipe(id);if(!r){alert('Selecciona primero un plato.');return}modal(r.name,`<div class="recipe-detail">${img(r)}<div class="recipe-tabs"><button class="active" onclick="showRecipePane('ingredients',this)">Ingredientes</button><button onclick="showRecipePane('steps',this)">Elaboración</button><button onclick="showRecipePane('nutrition',this)">Nutrición</button></div><div id="recipePane"></div></div>`,`<button class="btn" onclick="closeModal()">Cerrar</button><button class="btn primary" onclick="editRecipe('${r.id}')">Editar</button>`);window.activeRecipeId=r.id;showRecipePane('ingredients',document.querySelector('.recipe-tabs button'))}
function showRecipePane(tab,btn){document.querySelectorAll('.recipe-tabs button').forEach(b=>b.classList.toggle('active',b===btn));const r=recipe(window.activeRecipeId);document.querySelector('#recipePane').innerHTML=tab==='ingredients'?`<h3>Ingredientes por ración</h3><ul>${r.ingredients.map(x=>`<li>${esc(x.name)} — ${x.qty} ${esc(x.unit)}</li>`).join('')}</ul>`:tab==='steps'?`<h3>Elaboración · ${r.time||'?'} min</h3><p>${esc(r.steps||'Preparación pendiente de completar.')}</p>`:`<h3>Valor nutricional</h3><p>${r.nutrition?esc(JSON.stringify(r.nutrition)):'Pendiente de cálculo verificado. No se muestran valores inventados.'}</p>`}
// La semana activa se calcula a partir de la fecha actual en la primera apertura.
if(!db.ui.visualV3){const today=new Date();const target=today>=new Date(2026,10,1)&&today<new Date(2028,0,1)?today:new Date(2026,10,23);db.ui.date=iso(monday(target));db.ui.day=(target.getDay()+6)%7;db.ui.tab='day';db.ui.visualV3=true;save()}
function fillWeeks(){const y=+document.querySelector('#year').value,m=+document.querySelector('#month').value,w=document.querySelector('#week');const first=new Date(y,m,1),last=new Date(y,m+1,0);let cur=monday(first),arr=[];while(cur<=last){arr.push(iso(cur));cur.setDate(cur.getDate()+7)}w.innerHTML=arr.map((s,j)=>`<option value="${s}">Semana ${j+1}</option>`).join('');w.value=arr.includes(weekStart())?weekStart():arr[0]}
function render(){selector();document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===db.ui.tab));document.querySelector('#content').innerHTML=({week:weekView,day:dayView,edit:editView,recipes:recipeView,shop:shoppingView,settings:settingsView}[db.ui.tab]||dayView)();const area=document.querySelector('#swipeArea');if(area){let startX=0,startY=0;area.addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX;startY=e.changedTouches[0].screenY},{passive:true});area.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-startX,dy=e.changedTouches[0].screenY-startY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3){const n=(db.ui.day??0)+(dx<0?1:-1);if(n>=0&&n<7){db.ui.day=n;save();render()}}},{passive:true})}}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));document.querySelector('#year').onchange=()=>{fillWeeks();navigate(document.querySelector('#week').value)};document.querySelector('#month').onchange=()=>{fillWeeks();navigate(document.querySelector('#week').value)};document.querySelector('#week').onchange=e=>navigate(e.target.value);render();
</script></body></html>
